name: abcf
channels:
  - conda-forge
dependencies:
  - python>=3.10
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - pyyaml
  - emcee
  - arviz
  - salib
  - statsmodels
  - matplotlib
  - seaborn
  - corner
  - tqdm
  - pytest
  - pip
  - pip:
      # h5py from pip: the wheel bundles its own HDF5 DLLs (on some Windows PCs the conda
      # h5py fails with 'DLL load failed while importing defs')
      - h5py
      - -e .
